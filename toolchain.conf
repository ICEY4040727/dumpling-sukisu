# --- KernelSU-family root driver ---
# SukiSU-Ultra is the proven option on this 4.4 tree (builtin branch).
# KernelSU-Next (pershoot/KernelSU-Next) is the alternative to try: it ships
# SUSFS built in, but none of its branches have ever compiled here — every
# 4.4 compat shim, hook and self-check in build.sh targets SukiSU's source
# layout, so switching repos means re-running the whole debug loop
# (Run #1-#8). Its repo layout matches (kernel/ userspace/ manager/), so
# integrate_sukisu's symlink works unchanged.
#   SUKISU_REPO=https://github.com/pershoot/KernelSU-Next.git SUKISU_REF=next-susfs
# Branches: dev, dev-susfs, next-susfs, next-susfs_OLD, ...
SUKISU_REPO="${SUKISU_REPO:-https://github.com/SukiSU-Ultra/SukiSU-Ultra.git}"
# main    = kprobes + sys_enter tracepoint; proven broken on 4.4 (Run #1)
# builtin = no kprobes, manual hook entry points patched into fs/ and kernel/;
#           the only branch that has ever compiled against this 4.4 tree
# This default MUST match the sukisu_ref default in .github/workflows/build.yml.
# Steps without an explicit env (e.g. Pack AnyKernel3 zip before 2026-11-10)
# fall back to it, so a wrong default silently mislabels the flashable zip.
SUKISU_REF="${SUKISU_REF:-builtin}"

DEFCONFIG=lineage_oneplus5_defconfig
KERNEL_IMAGE=Image.gz-dtb
