name: Build dumpling SukiSU kernel

on:
  workflow_dispatch:
    inputs:
      ksu_repo:
        description: >
          Root driver repo. Default is SukiSU-Ultra (the only one ever
          compiled here). Alternative:
          https://github.com/pershoot/KernelSU-Next.git — ships SUSFS
          built in, but has never compiled against this 4.4 tree, so
          expect a fresh debug loop like Run #1-#8.
        required: true
        default: https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
        type: string
      sukisu_ref:
        description: >
          Branch of the repo above. SukiSU-Ultra: builtin (default, only
          branch proven on 4.4), old, builtin-new, main (broken, Run #1).
          KernelSU-Next: next-susfs, dev. Check the repo's branch list
          before typing something else.
        required: true
        default: builtin
        type: string

jobs:
  build:
    # Same runner as the upstream op5dc CI (verified in their main.yml).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Only the immutable downloads are cached. The kernel tree and KernelSU
      # checkout are rebuilt every run so a branch switch cannot reuse the
      # wrong source tree. Save happens right after prepare, because a failed
      # compile would otherwise skip the cache post-step entirely.
      - name: Restore source and toolchain cache
        id: src-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/*.zip
            work/*.tar.gz
            work/clang-r547379
            work/android_prebuilts_*
          key: dumpling-src-${{ hashFiles('toolchain.conf') }}
          restore-keys: |
            dumpling-src-

      - name: System dependencies
        run: |
          sudo apt update
          sudo apt install -y libssl-dev libc6-dev binutils libgcc-11-dev \
            zip unzip wget tar python3
          # GCC 4.9 wrappers expect /usr/bin/python with python2 syntax.
          sudo apt install -y python2 || true
          if [ ! -e /usr/bin/python ] && command -v python2 >/dev/null 2>&1; then
            sudo ln -s "$(command -v python2)" /usr/bin/python || true
          fi

      - name: Prepare sources and self-check
        env:
          SUKISU_REF: ${{ inputs.sukisu_ref }}
          SUKISU_REPO: ${{ inputs.ksu_repo }}
        run: |
          set -o pipefail
          bash ./build.sh prepare 2>&1 | tee prepare.log

      # Save immediately after prepare. A failed compile skips the cache
      # post-step, which would otherwise re-download ~19 minutes of toolchains
      # on every retry.
      - name: Save source and toolchain cache
        if: success() && steps.src-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work/*.zip
            work/*.tar.gz
            work/clang-r547379
            work/android_prebuilts_*
          key: dumpling-src-${{ hashFiles('toolchain.conf') }}

      - name: Compile kernel
        env:
          SUKISU_REF: ${{ inputs.sukisu_ref }}
          SUKISU_REPO: ${{ inputs.ksu_repo }}
        run: |
          set -o pipefail
          bash ./build.sh build 2>&1 | tee build.log

      - name: Show error lines and log tails in job summary
        if: failure()
        run: |
          # $GITHUB_STEP_SUMMARY is an append-only Markdown file, so write
          # order is display order. Two passes: ALL error blocks first, tails
          # after. A single per-file loop would put a successful prepare.log's
          # "no errors" block above the real compile errors.
          found=0
          for f in prepare.log build.log; do
            [ -f "$f" ] || continue
            errs=$(grep -nE '\[FAIL\]|MISSING|error:|fatal error:|Error [0-9]|undefined reference|No such file' "$f" | head -n 80) || true
            [ -n "$errs" ] || continue
            found=$((found + 1))
            {
              echo "## $f - error lines"
              echo '```'
              printf '%s\n' "$errs"
              echo '```'
              echo ''
            } >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found" -eq 0 ]; then
            {
              echo '## Error lines'
              echo ''
              echo '(no error pattern matched in either log; see the tails below)'
              echo ''
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in prepare.log build.log; do
            [ -f "$f" ] || continue
            {
              echo "## $f - last 100 lines"
              echo '```'
              tail -n 100 "$f"
              echo '```'
              echo ''
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.sukisu_ref }}-run${{ github.run_number }}
          path: |
            prepare.log
            build.log
          if-no-files-found: warn
          retention-days: 14

      # The artifact name follows the repo input, so a KernelSU-Next build is
      # never labelled "sukisu". Default repo keeps the historical name.
      - name: Resolve artifact name
        id: names
        env:
          KSU_REPO: ${{ inputs.ksu_repo }}
          KSU_REF: ${{ inputs.sukisu_ref }}
        run: |
          base="${KSU_REPO##*/}"
          base="${base%.git}"
          case "$base" in
            SukiSU-Ultra|SukiSU) slug=sukisu ;;
            KernelSU-Next)       slug=kernelsu-next ;;
            "")                  slug=ksu ;;
            *)                   slug=$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]') ;;
          esac
          artifact="dumpling-${slug}-${KSU_REF}-4.4.302"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "resolved artifact name: $artifact"

      - name: Pack AnyKernel3 zip
        env:
          SUKISU_REF: ${{ inputs.sukisu_ref }}
          SUKISU_REPO: ${{ inputs.ksu_repo }}
        run: bash ./build.sh pack

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: out/*.zip
          compression-level: 0
