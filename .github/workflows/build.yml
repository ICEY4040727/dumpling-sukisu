name: Build dumpling SukiSU kernel

on:
  workflow_dispatch:
    inputs:
      sukisu_ref:
        description: SukiSU-Ultra branch (builtin ships the complete 4.4 compat layer)
        required: true
        default: builtin
        type: choice
        options:
          - builtin
          - old
          - builtin-new
          - main

jobs:
  build:
    # Same runner as the upstream op5dc CI (verified in their main.yml).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Only the immutable downloads are cached. The kernel tree and KernelSU
      # checkout are rebuilt every run so a branch switch cannot reuse the
      # wrong source tree. Save happens right after prepare, because a failed
      # compile would otherwise skip the cache post-step entirely.
      - name: Restore source and toolchain cache
        id: src-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/*.zip
            work/*.tar.gz
            work/clang-r547379
            work/android_prebuilts_*
          key: dumpling-src-${{ hashFiles('toolchain.conf') }}
          restore-keys: |
            dumpling-src-

      - name: System dependencies
        run: |
          sudo apt update
          sudo apt install -y libssl-dev libc6-dev binutils libgcc-11-dev \
            zip unzip wget tar python3
          # GCC 4.9 wrappers expect /usr/bin/python with python2 syntax.
          sudo apt install -y python2 || true
          if [ ! -e /usr/bin/python ] && command -v python2 >/dev/null 2>&1; then
            sudo ln -s "$(command -v python2)" /usr/bin/python || true
          fi

      - name: Prepare sources and self-check
        env:
          SUKISU_REF: ${{ inputs.sukisu_ref }}
        run: |
          set -o pipefail
          bash ./build.sh prepare 2>&1 | tee prepare.log

      # Save immediately after prepare. A failed compile skips the cache
      # post-step, which would otherwise re-download ~19 minutes of toolchains
      # on every retry.
      - name: Save source and toolchain cache
        if: success() && steps.src-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work/*.zip
            work/*.tar.gz
            work/clang-r547379
            work/android_prebuilts_*
          key: dumpling-src-${{ hashFiles('toolchain.conf') }}

      - name: Compile kernel
        env:
          SUKISU_REF: ${{ inputs.sukisu_ref }}
        run: |
          set -o pipefail
          bash ./build.sh build 2>&1 | tee build.log

      - name: Show error lines and log tails in job summary
        if: failure()
        run: |
          for f in prepare.log build.log; do
            [ -f "$f" ] || continue
            {
              echo "## $f - error lines"
              echo '```'
              grep -nE '\[FAIL\]|MISSING|error:|fatal error:|Error [0-9]|undefined reference|No such file' "$f" | head -n 80 || true
              echo '```'
              echo ''
              echo "## $f - last 100 lines"
              echo '```'
              tail -n 100 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.sukisu_ref }}-run${{ github.run_number }}
          path: |
            prepare.log
            build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Pack AnyKernel3 zip
        run: bash ./build.sh pack

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: dumpling-sukisu-${{ inputs.sukisu_ref }}-4.4.302
          path: out/*.zip
          compression-level: 0
